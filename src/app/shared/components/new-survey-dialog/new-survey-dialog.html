<dialog #newSurveyDialog (cancel)="onClose()">
    <div class="new_servey-container">
        <app-survey-state purpose="state" surveyState="draft"></app-survey-state>
        <header class="new_servey-header">
            <span class="new_servey-header-headline">Create new Servey</span>
            <app-secondary-button textforBtn="cancel" (btnClick)="close()"></app-secondary-button>
        </header>
        <div class="survey-form">
            <form class="survey-form-grid" [formGroup]="serveyForm">
                <div class="survey-form-grid--left">
                    <app-input-field class="title-field" [inputfieldvariant]="'labelOnTop'"
                        [control]="serveyForm.controls.surveyName" label="Survey name"
                        [hasTrash]="true"></app-input-field>
                </div>
                <div class="survey-form-grid--right">

                </div>
            </form>

        </div>
    </div>
</dialog>
