<article>
    <span class="input-container" [class]="inputfieldvariant()">
        <label class="input-container-label" for="my-input">{{label()}}</label>
        <input class="input-container-input" id="my-input" name="text">
        <p class="input-container-error"></p>
        <button class="input-container-trash">
            <img src="/icons/trash-icon.svg" alt="">
        </button>
    </span>
</article>
