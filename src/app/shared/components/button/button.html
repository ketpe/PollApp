<button [class]="btnConfig().class +'_btn'" (click)="btnClick.emit()">
    <span [class]="btnConfig().class+'_btn-label'">{{btnText()}}</span>
    @if (btnConfig().imagePath) {
    <img [class]="btnConfig().class +'_btn-img'" src="{{btnConfig().imagePath}}" alt="add circle" srcset="">}
    @if (btnConfig().class === 'tertiary') {
    <hr>
    }
</button>
