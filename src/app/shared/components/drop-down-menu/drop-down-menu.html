<aside class="drop_down-container">
    <button class="drop_down_menu" (mouseenter)="currentStatus = 'hover'" (mouseleave)="currentStatus = 'normal'"
        (mousedown)="currentStatus = 'active'" (mouseup)="currentStatus = 'hover'"
        (touchstart)="currentStatus = 'active'; $event.stopPropagation()" (touchend)="currentStatus = 'normal'"
        (click)="toggleDropDown()">

        <span class=" drop_down_menu__headline">Sort by categories</span>
        <img [src]="getArrowPathByState(currentStatus)" alt="Drop Down Arrow">
    </button>
    @if (isCategoryShow()){
    <ul class="drop_down_menu__list" id="drop_down_menu__list">
        @if (isOverview()) {
        <li class="drop_down_menu__list-item" (click)="selectCategory('All Surveys')">All Surveys</li>}
        @for (item of this.surveysService.categories(); track $index) {
        <li class="drop_down_menu__list-item" (click)="selectCategory(item)">{{item.name}}</li>
        }
    </ul>
    }

    <p class="drop_down_menu__selectedCategorie" [class.is-hidden]="selectedCategory() == 'All Surveys'">{{
        selectedCategoryObj?.name }}</p>

</aside>
